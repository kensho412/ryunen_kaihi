name: check

on:
  schedule:
    # JST 06:07（受付開始・抽選直後） / 12:07 / 21:07。GitHub の cron は UTC・数分〜数十分遅れることがある
    - cron: "7 21 * * *"
    - cron: "7 3 * * *"
    - cron: "7 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: fetch & notify
        env:
          DATA_PASSPHRASE: ${{ secrets.DATA_PASSPHRASE }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          WELLNESS_USER: ${{ secrets.WELLNESS_USER }}
          WELLNESS_PASS: ${{ secrets.WELLNESS_PASS }}
          FAVORITES: ${{ vars.FAVORITES }}
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python scraper/run.py
      - name: commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.enc.json
          git diff --cached --quiet && exit 0
          git commit -m "data: $(TZ=Asia/Tokyo date '+%m/%d %H:%M')"
          # 実行中に別の push があっても失敗しないよう、最新を取り込んでから push
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 5
          done
          exit 1
